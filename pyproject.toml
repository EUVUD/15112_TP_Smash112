[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smash112"
version = "0.1.0"
description = "A CMU Graphics platform fighting game with a gameplay log QA agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cmu-graphics",
]

[project.scripts]
smash112-log-agent = "tools.game_log_agent.analyzer:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
